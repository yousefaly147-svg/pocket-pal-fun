name: Notify search engines with IndexNow
# IndexNow can notify participating engines such as Bing; it is not a Google indexing submission.
# Keep smoke-test titles in sync with the current English/Arabic route metadata before submitting URLs.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/sitemap.xml'
      - 'src/routes/index.tsx'
      - 'src/routes/ar.index.tsx'
      - 'src/routes/about.tsx'
      - 'src/routes/ar.about.tsx'
      - 'src/routes/help.tsx'
      - 'src/routes/ar.help.tsx'
      - 'src/routes/guides.tsx'
      - 'src/routes/ar.guides.tsx'
      - 'src/routes/savings-goals.tsx'
      - 'src/routes/ar.savings-goals.tsx'
      - 'src/routes/monthly-expenses-template.tsx'
      - 'src/routes/ar.monthly-expenses-template.tsx'
      - 'src/routes/daily-budget-calculator.tsx'
      - 'src/routes/ar.daily-budget-calculator.tsx'
      - 'src/routes/privacy-policy.tsx'
      - 'src/routes/ar.privacy-policy.tsx'
      - 'src/routes/terms.tsx'
      - 'src/routes/ar.terms.tsx'
      - 'src/routes/__root.tsx'
      - 'src/components/pocket/public-page-layout.tsx'
      - 'src/routes/monthly-budget.tsx'
      - 'src/routes/ar.monthly-budget.tsx'
      - 'src/routes/expense-tracking.tsx'
      - 'src/routes/ar.expense-tracking.tsx'
      - 'src/routes/egp-budget-calculator.tsx'
      - 'src/routes/ar.egp-budget-calculator.tsx'
      - 'src/components/pocket/landing-page.tsx'
      - 'src/components/pocket/guide-article-page.tsx'
      - 'src/components/pocket/egp-budget-calculator.tsx'
      - 'src/components/pocket/daily-budget-calculator.tsx'
      - 'src/lib/i18n/en.ts'
      - 'src/lib/i18n/ar.ts'
      - 'src/lib/public-seo.ts'
      - 'src/lib/website-schema.ts'
      - 'src/lib/tool-content.ts'
      - '.github/workflows/indexnow.yml'

permissions:
  contents: read

concurrency:
  group: pocketjr-indexnow
  cancel-in-progress: false

jobs:
  submit-updated-public-urls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the deployed public IndexNow key
        shell: bash
        env:
          INDEXNOW_KEY: pocketjrindexnow20261031a9f4c82d
        run: |
          set -euo pipefail
          KEY_URL="https://pocketjr.lovable.app/${INDEXNOW_KEY}.txt"
          echo "Checking public key at ${KEY_URL}"
          ACTUAL="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 "${KEY_URL}")"
          if [[ "${ACTUAL}" != "${INDEXNOW_KEY}" ]]; then
            echo "::error::The deployed key file content does not exactly match the configured IndexNow key."
            exit 1
          fi
          echo "The public key file is deployed and valid."

      - name: Smoke-test published English, Arabic and calculator pages
        shell: bash
        run: |
          set -euo pipefail

          check_page() {
            local path="$1"
            local expected_title="$2"
            local html
            html="$(curl --fail --location --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 "https://pocketjr.lovable.app${path}")"

            expected_title_html="${expected_title//&/&amp;}"
            if ! grep -Fq "${expected_title}" <<< "${html}" && ! grep -Fq "${expected_title_html}" <<< "${html}"; then
              actual_title="$(grep -o '<title[^>]*>[^<]*</title>' <<< "${html}" | head -n 1 || true)"
              echo "::error::Expected page title was not found for ${path}; received ${actual_title:-no title tag}"
              exit 1
            fi
            if ! grep -Fq "https://pocketjr.lovable.app${path}" <<< "${html}"; then
              echo "::error::Expected canonical URL was not found for ${path}"
              exit 1
            fi
            if [[ "${path}" == *calculator ]]; then
              if ! grep -Fq "FAQPage" <<< "${html}"; then
                echo "::error::FAQ structured data was not found for ${path}"
                exit 1
              fi
            fi
            echo "Verified published page: ${path}"
          }

          robots="$(curl --fail --location --silent --show-error "https://pocketjr.lovable.app/robots.txt")"
          if ! grep -Fq "Sitemap: https://pocketjr.lovable.app/sitemap.xml" <<< "${robots}"; then
            echo "::error::robots.txt does not point to the Pocketjr sitemap."
            exit 1
          fi

          sitemap="$(curl --fail --location --silent --show-error "https://pocketjr.lovable.app/sitemap.xml")"
          sitemap_url_count="$(grep -o '<loc>' <<< "${sitemap}" | wc -l | tr -d ' ')"
          if [[ "${sitemap_url_count}" != "24" ]]; then
            echo "::error::Expected 24 public URLs in the served sitemap; found ${sitemap_url_count}."
            exit 1
          fi
          if ! grep -Fq "<loc>https://pocketjr.lovable.app/ar</loc>" <<< "${sitemap}"; then
            echo "::error::The served sitemap is missing the canonical Arabic homepage."
            exit 1
          fi
          echo "Verified robots.txt and all 24 public URLs in the live sitemap."

          # Sitemap entries must be canonical URLs that return HTTP 200 directly.
          # Do not follow redirects here: curl -L smoke tests would hide 3XX responses.
          while IFS= read -r url; do
            response="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}|%{redirect_url}' \
              --retry 3 --retry-connrefused --retry-delay 5 --max-time 30 "$url")"
            status="${response%%|*}"
            redirect="${response#*|}"
            if [[ "$status" != "200" ]]; then
              echo "::error::Sitemap URL does not directly return HTTP 200: ${url} (HTTP ${status}; redirect: ${redirect:-none})"
              exit 1
            fi
            echo "Verified direct HTTP 200: ${url}"
          done < <(grep -oP '(?<=<loc>)[^<]+' <<< "${sitemap}")

          check_page "/" "Free Expense Tracker & Budget Planner | Pocketjr Finance"
          check_page "/ar" "أداة مجانية لتتبع المصاريف وإدارة الميزانية | Pocketjr Finance"
          check_page "/monthly-budget" "Monthly Budget: Make Your Salary Last | Pocketjr Finance"
          check_page "/ar/monthly-budget" "الميزانية الشهرية: إزاي تخلي المرتب يكفي | Pocketjr Finance"
          check_page "/expense-tracking" "Expense Tracking: App or Spreadsheet? | Pocketjr Finance"
          check_page "/ar/expense-tracking" "تتبع المصاريف: تطبيق ولا جدول؟ | Pocketjr Finance"
          check_page "/egp-budget-calculator" "Free EGP Monthly Budget Calculator for Egypt | Pocketjr Finance"
          check_page "/ar/egp-budget-calculator" "حاسبة الميزانية الشهرية بالجنيه المصري مجانًا | Pocketjr Finance"
          check_page "/daily-budget-calculator" "Daily Budget Calculator Until Payday | Pocketjr Finance"
          check_page "/ar/daily-budget-calculator" "حاسبة حد الصرف اليومي حتى موعد القبض | Pocketjr Finance"

      - name: Submit recently updated canonical public URLs
        shell: bash
        env:
          INDEXNOW_KEY: pocketjrindexnow20261031a9f4c82d
        run: |
          set -euo pipefail
          KEY_LOCATION="https://pocketjr.lovable.app/${INDEXNOW_KEY}.txt"
          jq -n \
            --arg host "pocketjr.lovable.app" \
            --arg key "${INDEXNOW_KEY}" \
            --arg keyLocation "${KEY_LOCATION}" \
            '{
              host: $host,
              key: $key,
              keyLocation: $keyLocation,
              urlList: [
                "https://pocketjr.lovable.app/",
                "https://pocketjr.lovable.app/ar",
                "https://pocketjr.lovable.app/about",
                "https://pocketjr.lovable.app/ar/about",
                "https://pocketjr.lovable.app/help",
                "https://pocketjr.lovable.app/ar/help",
                "https://pocketjr.lovable.app/guides",
                "https://pocketjr.lovable.app/ar/guides",
                "https://pocketjr.lovable.app/privacy-policy",
                "https://pocketjr.lovable.app/ar/privacy-policy",
                "https://pocketjr.lovable.app/terms",
                "https://pocketjr.lovable.app/ar/terms",
                "https://pocketjr.lovable.app/monthly-budget",
                "https://pocketjr.lovable.app/ar/monthly-budget",
                "https://pocketjr.lovable.app/expense-tracking",
                "https://pocketjr.lovable.app/ar/expense-tracking",
                "https://pocketjr.lovable.app/savings-goals",
                "https://pocketjr.lovable.app/ar/savings-goals",
                "https://pocketjr.lovable.app/egp-budget-calculator",
                "https://pocketjr.lovable.app/ar/egp-budget-calculator",
                "https://pocketjr.lovable.app/monthly-expenses-template",
                "https://pocketjr.lovable.app/ar/monthly-expenses-template",
                "https://pocketjr.lovable.app/daily-budget-calculator",
                "https://pocketjr.lovable.app/ar/daily-budget-calculator"
              ]
            }' > indexnow-payload.json

          echo "Submitting the 24 updated public canonical URLs to IndexNow."
          HTTP_STATUS="$(curl --silent --show-error \
            --output indexnow-response.txt \
            --write-out "%{http_code}" \
            --request POST "https://api.indexnow.org/indexnow" \
            --header "Content-Type: application/json; charset=utf-8" \
            --data-binary @indexnow-payload.json)"

          echo "IndexNow HTTP status: ${HTTP_STATUS}"
          echo "IndexNow response body:"
          cat indexnow-response.txt
          echo

          case "${HTTP_STATUS}" in
            200)
              echo "::notice::IndexNow processed and accepted the URL notification."
              ;;
            202)
              echo "::notice::IndexNow received the notification. Initial key validation is pending; this is an accepted response, not a submission failure."
              ;;
            *)
              echo "::error::IndexNow rejected the notification with HTTP ${HTTP_STATUS}. Check the response above."
              exit 1
              ;;
          esac

          echo "::notice::Acceptance confirms receipt only; it does not confirm crawling, indexing or ranking."
