name: Verify frontend
# Also run the standard frontend checks for localized-route and SEO changes.
on:
  push:
    branches: [main, fix/persist-selected-entry-dates]
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'bun.lock'
      - 'vite.config.*'
      - '.github/workflows/verify.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun ./node_modules/typescript/bin/tsc --noEmit
      - name: Lint changed SEO and calculator files
        run: >-
          bun ./node_modules/eslint/bin/eslint.js
          src/routes/index.tsx
          src/routes/ar.index.tsx
          src/routes/egp-budget-calculator.tsx
          src/routes/ar.egp-budget-calculator.tsx
          src/lib/i18n/en.ts
          src/lib/i18n/ar.ts
          src/lib/website-schema.ts
          src/lib/tool-content.ts
          src/components/pocket/egp-budget-calculator.tsx
          src/test/public-seo.test.ts
          --rule 'prettier/prettier: off'
      - run: bun run test
      - run: bun run build
